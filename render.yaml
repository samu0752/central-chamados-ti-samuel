services:
  - type: web
    name: central-chamados-ti-samuel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DEMO_READ_ONLY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: LOAD_SAMPLE_DATA
        value: "1"
      - key: SECRET_KEY
        generateValue: true
